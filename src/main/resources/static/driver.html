<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Haydovchi ilovasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        html, body { height: 100%; margin: 0; font-family: sans-serif; }
        #map { position: absolute; inset: 0; }
        .panel { position: absolute; z-index: 1000; left: 8px; right: 8px; background: #fff;
            border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.35); padding: 8px; font-size: 14px; }
        #top { top: 8px; display: flex; gap: 6px; }
        #top select { flex: 1; min-width: 0; }
        #bottom { bottom: 8px; }
        select, input, button { font-size: 15px; padding: 10px; box-sizing: border-box; width: 100%; margin: 3px 0; }
        #top select, #top button { width: auto; margin: 0; }
        button { border: 0; border-radius: 8px; color: #fff; background: #1565c0; }
        button.gray { background: #555; }
        button.red { background: #c62828; }
        #info { white-space: pre-line; font-weight: 600; margin: 4px 0; }
    </style>
</head>
<body>
<div id="top" class="panel">
    <select id="veh"></select>
    <button id="btnNew" class="gray">+</button>
</div>
<div id="map"></div>
<div id="bottom" class="panel">
    <div id="info">Mashinani tanlang</div>
    <input id="qFrom" value="Mening joylashuvim" placeholder="Qayerdan">
    <input id="qTo" placeholder="Qayerga">
    <button id="btn">Boshlash</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const map = L.map('map', { zoomControl: false }).setView([41.3111, 69.2797], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

    let pos = null, me = null, line = null, flag = null, timer = null, wake = null;

    async function api(url, body) {
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.status);
        return d;
    }

    // 1) GPS o'qish (buni faqat brauzer qila oladi)
    navigator.geolocation.watchPosition(p => {
        const first = !pos;
        pos = { lat: p.coords.latitude, lon: p.coords.longitude, kmh: (p.coords.speed || 0) * 3.6, t: p.timestamp };
        if (!me) me = L.circleMarker([pos.lat, pos.lon], { radius: 9, color: '#fff', weight: 3, fillColor: '#1565c0', fillOpacity: 1 }).addTo(map);
        me.setLatLng([pos.lat, pos.lon]);
        if (first) map.setView([pos.lat, pos.lon], 15);
    }, e => { $('info').textContent = 'GPS xato: ' + e.message; }, { enableHighAccuracy: true, maximumAge: 0 });

    // 2) Backend qaytargan holatni chizish
    function render(s, fit) {
        if (s.points && s.points.length) {
            if (line) line.setLatLngs(s.points); else line = L.polyline(s.points, { color: '#1565c0', weight: 6 }).addTo(map);
            if (fit) map.fitBounds(line.getBounds(), { padding: [50, 50] });
        } else if (line) { map.removeLayer(line); line = null; }
        if (flag) { map.removeLayer(flag); flag = null; }
        if (s.active && s.destLat != null) flag = L.marker([s.destLat, s.destLon]).addTo(map);
        const route = s.active ? `${s.from} \u2192 ${s.to}: ${(s.distanceMeters / 1000).toFixed(1)} km, ${Math.round(s.etaSeconds / 60)} daqiqa` : '';
        $('info').textContent = [route, s.message].filter(Boolean).join('\n') || 'GPS yuborilmoqda';
    }

    async function ping() {
        if (!pos) return;
        try {
            render(await api('/api/driver/ping', { vehicleId: Number($('veh').value), lat: pos.lat, lon: pos.lon,
                speedKmh: pos.kmh, timestamp: new Date(pos.t).toISOString() }));
        } catch (e) { $('info').textContent = "Aloqa yo'q: " + e.message; }
    }

    // 3) Boshlash / to'xtatish
    $('btn').onclick = async () => {
        if (timer) {
            clearInterval(timer); timer = null;
            if (wake) { wake.release(); wake = null; }
            try { render(await api('/api/driver/trips/cancel?vehicleId=' + $('veh').value)); } catch (e) {}
            $('btn').textContent = 'Boshlash'; $('btn').className = '';
            $('info').textContent = "To'xtatildi";
            return;
        }
        if (!$('veh').value) { $('info').textContent = "Mashinani tanlang yoki + bilan qo'shing"; return; }
        if (!pos) { $('info').textContent = 'Joylashuv hali aniqlanmadi (ruxsat bering)'; return; }
        try {
            if ($('qTo').value.trim()) {
                render(await api('/api/driver/trips', { vehicleId: Number($('veh').value), from: $('qFrom').value,
                    to: $('qTo').value, lat: pos.lat, lon: pos.lon }), true);
            }
            try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
            timer = setInterval(ping, 3000);
            $('btn').textContent = "To'xtatish"; $('btn').className = 'red';
        } catch (e) { $('info').textContent = e.message; }
    };

    // 4) Mashinalar ro'yxati
    async function loadVehicles(selectId) {
        const list = await (await fetch('/api/monitoring/vehicles')).json();
        $('veh').innerHTML = list.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
        const saved = selectId || localStorage.getItem('vehId');
        if (saved && list.some(v => String(v.id) === String(saved))) $('veh').value = saved;
    }
    $('veh').onchange = () => localStorage.setItem('vehId', $('veh').value);
    $('btnNew').onclick = async () => {
        const name = prompt('Mashina nomi:');
        if (!name) return;
        try {
            const d = await api('/api/monitoring/vehicles', { name: name.trim(), plate: '', speedLimitKmh: 60 });
            localStorage.setItem('vehId', d.id); await loadVehicles(d.id);
        } catch (e) { alert("Qo'shib bo'lmadi: " + e.message); }
    };
    loadVehicles().then(() => { $('info').textContent = 'Qayerga borishni yozing va Boshlash ni bosing'; });
</script>
</body>
</html>
