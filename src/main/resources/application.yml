server:
  port: 8080

routing:
  osm-file: data/uzbekistan-latest.osm.pbf
  graph-dir: graph-cache

spring:
  datasource:
    url: jdbc:h2:file:./data/monitoring;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2

monitoring:
  feeder:
    enabled: false
  stop-alert-seconds: 60